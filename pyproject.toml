[project]
name = "uqma"
version = "0.1.0"
description = "Turn-level uncertainty quantification for tool-using medical AI agents"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
gpu = ["vllm>=0.8", "torch>=2.4", "transformers>=4.44"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
